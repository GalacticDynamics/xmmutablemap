name: CI
permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

concurrency:
  # Pushes to main get a group per commit, so merges never cancel each
  # other and main keeps a complete CI record. PRs still supersede.
  group:
    ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main'
    && github.sha || '' }}
  cancel-in-progress: true

env:
  # Many color libraries just need this to be set to any value, but at least
  # one distinguishes color depth, where "3" -> "256-bit color".
  FORCE_COLOR: 3

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Install
        run: uv sync --no-default-groups --group nox --group lint --locked
      - name: Lint
        run: uv run --frozen nox -s lint

  tests:
    name: Check Python ${{ matrix.python-version }} on ${{ matrix.runs-on }}
    runs-on: ${{ matrix.runs-on }}
    needs: [format]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
        runs-on: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@702b425af1c366e68b4a9449a8de6dd98b63e979 # v7.1.2
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: uv sync --no-default-groups --group nox --group test --locked

      - name: Test package
        run: |
          uv run --frozen nox -s test -- --cov --cov-report=xml --cov-report=term --durations=20

      - name: Upload coverage report
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage artifact
        if: >-
          matrix.runs-on == 'ubuntu-latest' && matrix.python-version == '3.13'
          && (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report-python
          path: coverage.xml

  # Canary: resolve the newest releases instead of the lockfile, so a breaking
  # change (e.g. a new pytest major) surfaces here before it lands in uv.lock.
  # Deliberately not in `status`, so an upstream release cannot block merges.
  tests-latest:
    name: Check newest dependencies
    runs-on: ubuntu-latest
    needs: [format]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@702b425af1c366e68b4a9449a8de6dd98b63e979 # v7.1.2
        with:
          python-version: "3.13"

      - name: Test package
        run:
          uv run --no-default-groups --group test --upgrade pytest
          --durations=20

  upload-coverage-python:
    needs: tests
    if: >-
      ${{ !cancelled() && needs.tests.result == 'success' && (github.event_name
      != 'pull_request' || github.event.pull_request.head.repo.full_name ==
      github.repository) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      code-quality: write
    steps:
      - name: Download coverage artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-report-python
      - uses: actions/upload-code-coverage@bfa741d815a28cb064a8e3a0837e577457a017d5 # v1.4.3
        with:
          file: coverage.xml
          language: Python
          label: code-coverage-agent

  status:
    name: CI Pass
    runs-on: ubuntu-latest
    needs: [format, tests]
    if: always()
    steps:
      - name: All required jobs passed
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
